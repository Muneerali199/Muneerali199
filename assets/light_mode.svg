  <text x="575" y="360" fill="#0F172A" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">FULL-STACK DEVELOPER / WEB3 BUILDER</text>
  <text x="575" y="405" fill="#475569" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20">Turning curious ideas into polished digital products.</text>
  <text x="575" y="436" fill="#475569" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20">React · Next.js · Node.js · Solidity · AI</text>

