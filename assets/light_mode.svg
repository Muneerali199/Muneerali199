  <rect x="575" y="76" width="187" height="34" rx="17" fill="#0F172A"/>
  <circle cx="598" cy="93" r="5" fill="#22C55E"/>
  <text x="614" y="98" fill="white" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">OPEN TO BUILD</text>

  <text x="575" y="198" fill="#111827" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="-5">MUNEER</text>
  <text x="575" y="282" fill="url(#accent)" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="-5">ALI</text>
