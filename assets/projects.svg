<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440">
  <defs>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="border1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="border2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="border3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round1"><rect x="20" y="20" width="384" height="185" rx="14"/></clipPath>
    <clipPath id="round2"><rect x="436" y="20" width="384" height="185" rx="14"/></clipPath>
    <clipPath id="round3"><rect x="20" y="235" width="384" height="185" rx="14"/></clipPath>
  </defs>

  <style>
    @keyframes fadeSlideUp1 {
      0% { opacity: 0; transform: translateY(25px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp2 {
      0%, 15% { opacity: 0; transform: translateY(25px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp3 {
      0%, 30% { opacity: 0; transform: translateY(25px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes borderPulse1 {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes borderPulse2 {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes borderPulse3 {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes shimmer {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(600px); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes tagSlide {
      0% { opacity: 0; transform: translateX(-8px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes ctaPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .card1 { animation: fadeSlideUp1 0.8s ease-out forwards; }
    .card2 { animation: fadeSlideUp2 0.8s ease-out forwards; }
    .card3 { animation: fadeSlideUp3 0.8s ease-out forwards; }
    .border1 { animation: borderPulse1 3s ease-in-out infinite; }
    .border2 { animation: borderPulse2 3s ease-in-out infinite 0.5s; }
    .border3 { animation: borderPulse3 3s ease-in-out infinite 1s; }
    .shimmer1 { animation: shimmer 3s ease-in-out infinite; }
    .shimmer2 { animation: shimmer 3s ease-in-out infinite 0.5s; }
    .shimmer3 { animation: shimmer 3s ease-in-out infinite 1s; }
    .dot1 { animation: dotPulse 2s ease-in-out infinite; }
    .dot2 { animation: dotPulse 2s ease-in-out infinite 0.3s; }
    .dot3 { animation: dotPulse 2s ease-in-out infinite 0.6s; }
    .star { animation: starTwinkle 2s ease-in-out infinite; }
    .tag { animation: tagSlide 0.6s ease-out forwards; }
    .tag1 { animation-delay: 0.4s; opacity: 0; }
    .tag2 { animation-delay: 0.6s; opacity: 0; }
    .tag3 { animation-delay: 0.8s; opacity: 0; }
    .tag4 { animation-delay: 0.5s; opacity: 0; }
    .tag5 { animation-delay: 0.7s; opacity: 0; }
    .tag6 { animation-delay: 0.6s; opacity: 0; }
    .tag7 { animation-delay: 0.8s; opacity: 0; }
    .cta { animation: ctaPulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="840" height="440" rx="16" fill="#0d1117"/>

  <!-- ═══════════ CARD 1: DraftdeckAI ═══════════ -->
  <g class="card1">
    <!-- Border glow -->
    <rect class="border1" x="19" y="19" width="386" height="187" rx="15" fill="none" stroke="url(#border1)" stroke-width="1.5"/>
    <!-- Card bg -->
    <rect x="20" y="20" width="384" height="185" rx="14" fill="url(#card1)"/>
    <!-- Shimmer overlay -->
    <g clip-path="url(#round1)">
      <rect class="shimmer1" x="-200" y="20" width="120" height="185" fill="white" fill-opacity="0.03" transform="skewX(-20)"/>
    </g>

    <!-- Window dots -->
    <circle class="dot1" cx="40" cy="40" r="4" fill="#ff5f57"/>
    <circle class="dot2" cx="54" cy="40" r="4" fill="#febc2e"/>
    <circle class="dot3" cx="68" cy="40" r="4" fill="#28c840"/>

    <!-- Repo icon -->
    <g transform="translate(362, 32)">
      <path d="M2 7.5A2.5 2.5 0 014.5 5h15A2.5 2.5 0 0122 7.5v9a2.5 2.5 0 01-2.5 2.5h-15A2.5 2.5 0 012 16.5v-9z" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
      <path d="M8 5V3.5A1.5 1.5 0 019.5 2h5A1.5 1.5 0 0116 3.5V5" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="2" y1="11" x2="22" y2="11" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
    </g>

    <!-- Title -->
    <text x="40" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">DraftdeckAI</text>

    <!-- Description -->
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.2">
      <tspan x="40" y="94">AI-powered document creation platform.</tspan>
      <tspan x="40" y="112">Describe your ideas, get polished resumes,</tspan>
      <tspan x="40" y="130">presentations &amp; CVs instantly.</tspan>
    </text>

    <!-- Tags -->
    <g class="tag tag1">
      <rect x="40" y="144" width="76" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="78" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="500">TypeScript</text>
    </g>
    <g class="tag tag2">
      <rect x="124" y="144" width="38" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="143" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="500">AI</text>
    </g>
    <g class="tag tag3">
      <rect x="170" y="144" width="68" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="204" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="500">Next.js</text>
    </g>

    <!-- Stats -->
    <g transform="translate(40, 178)">
      <!-- Stars -->
      <g class="star">
        <path d="M5 0l1.5 3.1 3.4.5-2.5 2.4.6 3.4L5 7.8 1.9 9.4l.6-3.4L0 3.6l3.4-.5z" fill="url(#starGrad)" transform="scale(0.7)"/>
      </g>
      <text x="12" y="7" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" font-weight="600">44</text>

      <!-- Forks -->
      <g transform="translate(40, -1)">
        <path d="M3 1v4M9 1v4M3 5a3 3 0 003 3 3 3 0 003-3" fill="none" stroke="#6e7681" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="3" cy="1" r="1" fill="#6e7681"/>
        <circle cx="9" cy="1" r="1" fill="#6e7681"/>
        <circle cx="6" cy="11" r="1" fill="#6e7681"/>
        <line x1="6" y1="8" x2="6" y2="11" stroke="#6e7681" stroke-width="1.2"/>
      </g>
      <text x="54" y="7" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7681">134</text>

      <!-- Lang dot -->
      <circle cx="85" cy="4" r="4" fill="#3178c6"/>
      <text x="94" y="8" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7681">TypeScript</text>
    </g>
  </g>

  <!-- ═══════════ CARD 2: Thunder ═══════════ -->
  <g class="card2">
    <rect class="border2" x="435" y="19" width="386" height="187" rx="15" fill="none" stroke="url(#border2)" stroke-width="1.5"/>
    <rect x="436" y="20" width="384" height="185" rx="14" fill="url(#card2)"/>
    <g clip-path="url(#round2)">
      <rect class="shimmer2" x="-200" y="20" width="120" height="185" fill="white" fill-opacity="0.03" transform="skewX(-20)"/>
    </g>

    <!-- Window dots -->
    <circle class="dot1" cx="456" cy="40" r="4" fill="#ff5f57"/>
    <circle class="dot2" cx="470" cy="40" r="4" fill="#febc2e"/>
    <circle class="dot3" cx="484" cy="40" r="4" fill="#28c840"/>

    <!-- Lightning icon -->
    <g transform="translate(782, 32)">
      <path d="M10 1L3 13h6l-1 8 7-12h-6z" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" stroke-linejoin="round"/>
    </g>

    <!-- Title -->
    <text x="456" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">Thunder</text>

    <!-- Description -->
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.2">
      <tspan x="456" y="94">Modern website builder — drag, drop,</tspan>
      <tspan x="456" y="112">and deploy stunning sites in minutes.</tspan>
      <tspan x="456" y="130">No code. Just creativity.</tspan>
    </text>

    <!-- Tags -->
    <g class="tag tag4">
      <rect x="456" y="144" width="76" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="494" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="500">TypeScript</text>
    </g>
    <g class="tag tag5">
      <rect x="540" y="144" width="55" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="567" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="500">React</text>
    </g>
    <g class="tag tag6">
      <rect x="603" y="144" width="68" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="637" y="159" font-family="'Segoe UI', monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="500">Builder</text>
    </g>

    <!-- Stats -->
    <g transform="translate(456, 178)">
      <g class="star">
        <path d="M5 0l1.5 3.1 3.4.5-2.5 2.4.6 3.4L5 7.8 1.9 9.4l.6-3.4L0 3.6l3.4-.5z" fill="url(#starGrad)" transform="scale(0.7)"/>
      </g>
      <text x="12" y="7" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" font-weight="600">17</text>

      <g transform="translate(36, -1)">
        <path d="M3 1v4M9 1v4M3 5a3 3 0 003 3 3 3 0 003-3" fill="none" stroke="#6e7681" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="3" cy="1" r="1" fill="#6e7681"/>
        <circle cx="9" cy="1" r="1" fill="#6e7681"/>
        <circle cx="6" cy="11" r="1" fill="#6e7681"/>
        <line x1="6" y1="8" x2="6" y2="11" stroke="#6e7681" stroke-width="1.2"/>
      </g>
      <text x="50" y="7" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7681">25</text>

      <circle cx="78" cy="4" r="4" fill="#3178c6"/>
      <text x="87" y="8" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7681">TypeScript</text>
    </g>
  </g>

  <!-- ═══════════ CARD 3: Uptime ═══════════ -->
  <g class="card3">
    <rect class="border3" x="19" y="234" width="386" height="187" rx="15" fill="none" stroke="url(#border3)" stroke-width="1.5"/>
    <rect x="20" y="235" width="384" height="185" rx="14" fill="url(#card3)"/>
    <g clip-path="url(#round3)">
      <rect class="shimmer3" x="-200" y="235" width="120" height="185" fill="white" fill-opacity="0.03" transform="skewX(-20)"/>
    </g>

    <!-- Window dots -->
    <circle class="dot1" cx="40" cy="255" r="4" fill="#ff5f57"/>
    <circle class="dot2" cx="54" cy="255" r="4" fill="#febc2e"/>
    <circle class="dot3" cx="68" cy="255" r="4" fill="#28c840"/>

    <!-- Pulse icon -->
    <g transform="translate(362, 247)">
      <path d="M2 12h4l2-6 3 12 2-6h4l2 3h3" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title -->
    <text x="40" y="287" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">Uptime</text>

    <!-- Description -->
    <text font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.2">
      <tspan x="40" y="309">Real-time uptime monitoring service.</tspan>
      <tspan x="40" y="327">Track availability, get instant alerts,</tspan>
      <tspan x="40" y="345">keep services running 24/7.</tspan>
    </text>

    <!-- Tags -->
    <g class="tag tag6">
      <rect x="40" y="359" width="76" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="78" y="374" font-family="'Segoe UI', monospace" font-size="10" fill="#67e8f9" text-anchor="middle" font-weight="500">TypeScript</text>
    </g>
    <g class="tag tag7">
      <rect x="124" y="359" width="72" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="160" y="374" font-family="'Segoe UI', monospace" font-size="10" fill="#67e8f9" text-anchor="middle" font-weight="500">Monitor</text>
    </g>

    <!-- Stats -->
    <g transform="translate(40, 393)">
      <g class="star">
        <path d="M5 0l1.5 3.1 3.4.5-2.5 2.4.6 3.4L5 7.8 1.9 9.4l.6-3.4L0 3.6l3.4-.5z" fill="url(#starGrad)" transform="scale(0.7)"/>
      </g>
      <text x="12" y="7" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" font-weight="600">2</text>

      <circle cx="38" cy="4" r="4" fill="#3178c6"/>
      <text x="47" y="8" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7681">TypeScript</text>
    </g>
  </g>

  <!-- ═══════════ CTA CARD (bottom right) ═══════════ -->
  <g class="card3">
    <rect x="435" y="234" width="386" height="187" rx="15" fill="none" stroke="#6e7681" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <rect x="436" y="235" width="384" height="185" rx="14" fill="#0d1117"/>

    <!-- Explore more -->
    <g transform="translate(628, 310)">
      <!-- Plus icon circle -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#6e7681" stroke-width="1" stroke-opacity="0.4" class="cta"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="628" y="355" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6e7681" text-anchor="middle" letter-spacing="0.5">Explore 150+ more repos</text>
    <text x="628" y="373" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" letter-spacing="0.3">github.com/Muneerali199</text>
  </g>
</svg>