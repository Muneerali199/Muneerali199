<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="50%" stop-color="#05020a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.45)"/>
      <stop offset="40%" stop-color="rgba(6, 182, 212, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.04)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.01)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.6)"/>
      <stop offset="50%" stop-color="rgba(6, 182, 212, 0.1)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.4)"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot Matrix & Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <pattern id="lineGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    /* System Typography for Ultra-Crisp Rendering */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -1.5px;
      fill: url(#textShimmer);
      animation: shimmerText 6s linear infinite;
    }
    
    .role-badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      fill: #22d3ee;
    }

    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      line-height: 1.6;
    }

    .highlight {
      fill: #c084fc;
      font-weight: 600;
    }

    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #f8fafc;
      letter-spacing: 0.5px;
    }

    /* Keyframes */
    @keyframes shimmerText {
      0% { fill: url(#textShimmer); }
      100% { fill: url(#textShimmer); } 
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes spinRight {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinLeft {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes energyFlow {
      to { stroke-dashoffset: -100; }
    }

    @keyframes dataStream {
      0% { stroke-dashoffset: 600; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { stroke-dashoffset: -600; opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    /* Classes */
    .glass-card { animation: float1 6s ease-in-out infinite; }
    .status-dot { animation: pulseDot 2s ease-in-out infinite; transform-origin: center; }

    .hex-1 { animation: spinRight 30s linear infinite; transform-origin: center; }
    .hex-2 { animation: spinLeft 40s linear infinite; transform-origin: center; }
    .hex-3 { animation: spinRight 50s linear infinite; transform-origin: center; }

    .energy-ring { stroke-dasharray: 8 12; animation: energyFlow 2s linear infinite; }
    .data-line { stroke-dasharray: 100 600; animation: dataStream 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .scanner { animation: scanline 8s linear infinite; }
  </style>

  <!-- 1. Deep Space Void & Geometric Grids -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  <rect width="100%" height="100%" fill="url(#lineGrid)"/>
  <rect width="100%" height="100%" fill="url(#dotGrid)"/>

  <!-- 2. Ambient Light Leaks & Scanner -->
  <circle cx="800" cy="175" r="280" fill="url(#coreGlow)" filter="url(#heavyGlow)"/>
  <circle cx="100" cy="50" r="220" fill="rgba(139, 92, 246, 0.12)" filter="url(#heavyGlow)"/>
  <rect class="scanner" width="100%" height="2" fill="#22d3ee" filter="url(#neonBlur)" opacity="0.5"/>

  <!-- 3. Dynamic Data Streams (Background crossing) -->
  <path d="M -100 260 C 200 260, 300 80, 1100 80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <path d="M -100 260 C 200 260, 300 80, 1100 80" fill="none" stroke="#22d3ee" stroke-width="2" class="data-line" filter="url(#neonBlur)"/>
  
  <path d="M -100 300 C 400 300, 600 230, 1100 230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M -100 300 C 400 300, 600 230, 1100 230" fill="none" stroke="#ec4899" stroke-width="2" class="data-line" filter="url(#neonBlur)" style="animation-delay: 2s; stroke-dasharray: 50 600;"/>

  <!-- 4. The Glassmorphic Bento Card (Left) -->
  <g class="glass-card" transform="translate(60, 45)">
    <!-- Card Background -->
    <rect width="520" height="260" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.6))"/>
    
    <!-- Top Badge -->
    <g transform="translate(35, 35)">
      <rect width="190" height="26" rx="13" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#22d3ee" class="status-dot" filter="url(#neonBlur)"/>
      <text x="30" y="18" class="role-badge-text">SYSTEM ARCHITECT</text>
    </g>

    <!-- Name & Professional Mission -->
    <g transform="translate(35, 105)">
      <text x="0" y="0" class="title">Muneer Ali</text>
      <text x="0" y="45" class="desc">Engineering <tspan class="highlight">fault-tolerant</tspan> distributed systems</text>
      <text x="0" y="70" class="desc">and next-generation <tspan class="highlight">Web3 &amp; AI</tspan> architectures.</text>
      
      <!-- Tech Stack Pills -->
      <g transform="translate(0, 105)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="105" height="26" rx="13" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1"/>
        <text x="52.5" y="17" class="pill-text" text-anchor="middle">TypeScript</text>
        
        <!-- Pill 2 -->
        <rect x="115" y="0" width="75" height="26" rx="13" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
        <text x="152.5" y="17" class="pill-text" text-anchor="middle">React</text>
        
        <!-- Pill 3 -->
        <rect x="200" y="0" width="95" height="26" rx="13" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1"/>
        <text x="247.5" y="17" class="pill-text" text-anchor="middle">Solidity</text>
        
        <!-- Pill 4 -->
        <rect x="305" y="0" width="100" height="26" rx="13" fill="rgba(34, 211, 238, 0.15)" stroke="#22d3ee" stroke-width="1"/>
        <text x="355" y="17" class="pill-text" text-anchor="middle">AI / LLMs</text>
      </g>
    </g>
    
    <!-- Decorative bottom line in card -->
    <path d="M 35 235 L 485 235" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
    <path d="M 35 235 L 180 235" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#neonBlur)"/>
  </g>

  <!-- 5. Cybernetic Neural Core (Right) -->
  <g transform="translate(800, 175)">
    
    <!-- Outer Orbit Rings -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#8b5cf6" stroke-width="2" class="energy-ring" filter="url(#neonBlur)"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" stroke-dasharray="4 8"/>

    <!-- Rotating Hexagonal Constructs -->
    <g class="hex-1">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5"/>
      <circle cx="86.6" cy="-50" r="3.5" fill="#22d3ee" filter="url(#neonBlur)"/>
      <circle cx="-86.6" cy="50" r="3.5" fill="#22d3ee" filter="url(#neonBlur)"/>
    </g>

    <g class="hex-2">
      <polygon points="0,-80 69.3,-40 69.3,40 0,80 -69.3,40 -69.3,-40" fill="none" stroke="rgba(236, 72, 153, 0.5)" stroke-width="2"/>
      <circle cx="0" cy="-80" r="4.5" fill="#ec4899" filter="url(#neonBlur)"/>
      <circle cx="0" cy="80" r="4.5" fill="#ec4899" filter="url(#neonBlur)"/>
    </g>

    <g class="hex-3">
      <polygon points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    </g>

    <!-- The Core -->
    <circle cx="0" cy="0" r="28" fill="#030108" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#neonBlur)" class="status-dot"/>

    <!-- Radiating Connection Lines -->
    <g opacity="0.4">
      <line x1="0" y1="-28" x2="0" y2="-145" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 4"/>
      <line x1="24.2" y1="14" x2="125.5" y2="72.5" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 4"/>
      <line x1="-24.2" y1="14" x2="-125.5" y2="72.5" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 4"/>
    </g>
  </g>
</svg>