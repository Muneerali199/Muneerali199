    <filter id="shadow" x="28" y="35" width="516" height="570" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="#0B1020"/>
