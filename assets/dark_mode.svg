      <stop stop-color="#7C3AED" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="750" y1="90" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
