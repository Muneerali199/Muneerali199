<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Muneer Ali — Full-stack developer and Web3 builder</title>
  <desc id="desc">A dark profile banner with a portrait of Muneer Ali and a summary of his work.</desc>
  <defs>
