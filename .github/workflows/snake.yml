name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Muneerali199
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=gradient&color_dots=#0f0,#1a7f1a,#0d4429,#00FF41&color_empty=#161b22&color_border=#30363d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=gradient&color_dots=#0f0,#1a7f1a,#0d4429,#00FF41&color_empty=#161b22&color_border=#30363d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
